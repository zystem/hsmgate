steps:
  test:
    image: golang:1.26.9-bookworm
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -race ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    when:
      - event: push
      - event: pull_request
      - event: tag

  softhsm:
    # the PKCS#11 backend against SoftHSM2 (a software token); the card itself is run by hand with tools/card-decrypt-test.sh
    image: golang:1.26.9-bookworm
    commands:
      - apt-get update -qq
      - apt-get install -y -qq --no-install-recommends softhsm2 opensc
      - tools/softhsm-test.sh
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request
      - event: tag

  build:
    # cgo (the PKCS#11 binding): the binary is dynamic, so it is built where it will run: Debian bookworm
    image: golang:1.26.9-bookworm
    commands:
      - mkdir -p build
      - CGO_ENABLED=1 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${CI_COMMIT_TAG:-dev}" -o build/hsmgate ./cmd/hsmgate
      - build/hsmgate version
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request
      - event: tag

  package_release:
    image: alpine:3.22
    commands:
      - mkdir -p dist
      - cp build/hsmgate dist/hsmgate-linux-amd64
      - sha256sum dist/hsmgate-linux-amd64 > dist/hsmgate-linux-amd64.sha256
      - tar -czf dist/hsmgate-deploy.tar.gz LICENSE README.md api deploy docs
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_image:
    # the same plugin as the other repositories of this server (it needs WOODPECKER_PLUGINS_PRIVILEGED; a newer `woodpecker-cli lint` warns about that).
    # kaniko was tried and failed on this server's agents: "error removing bin to make way for new symlink: unlinkat //bin: invalid argument".
    image: woodpeckerci/plugin-docker-buildx:5.2.0
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: github_token
      platforms:
        - linux/amd64
      build_args:
        - VERSION=${CI_COMMIT_TAG##v}
      tags:
        - ${CI_COMMIT_TAG##v}
        - ${CI_COMMIT_TAG}
        - latest
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_release:
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api-key:
        from_secret: github_token
      files:
        - dist/*
      file-exists: overwrite
      generate-release-notes: true
      title: ${CI_COMMIT_TAG}
    depends_on:
      - package_release
      - publish_image
    when:
      - event: tag
        ref: refs/tags/v*

  renovate:
    image: renovate/renovate:latest
    commands:
      - renovate "$CI_REPO"
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN:
        from_secret: renovate_token
    when:
      - event: cron
        cron: renovate
      - event: manual
