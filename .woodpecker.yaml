steps:
  test:
    image: golang:1.26.9-bookworm
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -race ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    when:
      - event: push
      - event: pull_request
      - event: tag

  static:
    # static analysis: staticcheck, and gosec without G104 (unchecked errors: closing files and the best-effort audit line of a refusal, on purpose); each exception in the code has its reason
    image: golang:1.26.9-bookworm
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude=G104 -exclude-dir=test -exclude-dir=tools -exclude-generated ./...
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request
      - event: tag

  softhsm:
    # the PKCS#11 backend against SoftHSM2 (a software token); the card itself is run by hand with tools/card-decrypt-test.sh
    image: golang:1.26.9-bookworm
    commands:
      - apt-get update -qq
      - apt-get install -y -qq --no-install-recommends softhsm2 opensc
      - tools/softhsm-test.sh
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request
      - event: tag

  fuzz:
    # the parsers that face the network, a minute each; runs on a schedule: a cron job named "fuzz" in the repository settings of Woodpecker (Settings, Crons), not on every push
    image: golang:1.26.9-bookworm
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - go test -run '^$' -fuzz '^FuzzDecryptRequest$' -fuzztime 60s ./internal/face/transit
      - go test -run '^$' -fuzz '^FuzzUnwrap$' -fuzztime 60s ./internal/scheme/ecies
      - go test -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 30s ./internal/scheme/ecies
      - go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 60s ./internal/config
      - go test -run '^$' -fuzz '^FuzzVerify$' -fuzztime 60s ./internal/sigv4
      - go test -run '^$' -fuzz '^FuzzParseBlob$' -fuzztime 60s ./internal/face/kmsjson
      - go test -run '^$' -fuzz '^FuzzRequestBody$' -fuzztime 60s ./internal/face/kmsjson
    when:
      - event: cron
        cron: fuzz   # the name of the cron job in the repository settings

  kmsjson_sdk:
    # the KMS-JSON face against the vendor's official Go SDK (a module of its own: test/kmsjson-sdk)
    image: golang:1.26.9-bookworm
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - cd test/kmsjson-sdk && go test -count=1 ./...
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request
      - event: tag

  build:
    # cgo (the PKCS#11 binding): the binary is dynamic, so it is built where it will run: Debian bookworm
    image: golang:1.26.9-bookworm
    commands:
      - mkdir -p build
      - CGO_ENABLED=1 go build -buildmode=pie -trimpath -buildvcs=false -ldflags "-s -w -linkmode=external -extldflags '-Wl,-z,relro,-z,now' -X main.version=${CI_COMMIT_TAG:-dev}" -o build/hsmgate ./cmd/hsmgate
      - readelf -h build/hsmgate | grep -q "DYN" && readelf -d build/hsmgate | grep -q "BIND_NOW"
      - build/hsmgate version
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request
      - event: tag

  kmsjson_boto3:
    # the same face against the vendor's Python SDK, with the binary the build step made (same Debian release, so the same libc)
    image: python:3.12-slim-bookworm
    commands:
      - python -m venv /tmp/venv
      - /tmp/venv/bin/pip install -q -r test/kmsjson-boto3/requirements.txt
      - /tmp/venv/bin/python test/kmsjson-boto3/test_boto3.py build/hsmgate
    depends_on:
      - build
    when:
      - event: push
      - event: pull_request
      - event: tag

  package_release:
    image: alpine:3.22
    commands:
      - mkdir -p dist
      - cp build/hsmgate dist/hsmgate-linux-amd64
      - sha256sum dist/hsmgate-linux-amd64 > dist/hsmgate-linux-amd64.sha256
      - tar -czf dist/hsmgate-deploy.tar.gz LICENSE README.md api deploy docs
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  image:
    # the Dockerfile builds (nothing is pushed): the same plugin as the release, in dry-run
    image: woodpeckerci/plugin-docker-buildx:5.2.0
    settings:
      dry_run: true
      repo: ghcr.io/${CI_REPO}
      platforms:
        - linux/amd64
      build_args:
        - VERSION=dev
    depends_on:
      - test
    when:
      - event: push
      - event: pull_request

  publish_image:
    # the same plugin as the other repositories of this server (it needs WOODPECKER_PLUGINS_PRIVILEGED; a newer `woodpecker-cli lint` warns about that).
    # kaniko was tried and failed on this server's agents: "error removing bin to make way for new symlink: unlinkat //bin: invalid argument".
    image: woodpeckerci/plugin-docker-buildx:5.2.0
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: github_token
      platforms:
        - linux/amd64
      build_args:
        - VERSION=${CI_COMMIT_TAG##v}
      tags:
        - ${CI_COMMIT_TAG##v}
        - ${CI_COMMIT_TAG}
        - latest
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_release:
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api-key:
        from_secret: github_token
      files:
        - dist/*
      file-exists: overwrite
      generate-release-notes: true
      title: ${CI_COMMIT_TAG}
    depends_on:
      - package_release
      - publish_image
    when:
      - event: tag
        ref: refs/tags/v*

  renovate:
    image: renovate/renovate:latest
    commands:
      - renovate "$CI_REPO"
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN:
        from_secret: renovate_token
    when:
      - event: cron
        cron: renovate
      - event: manual
