name: DCO

# every commit of a pull request must carry a "Signed-off-by:" line (git commit -s): the Developer Certificate of Origin, see CONTRIBUTING.md; bots are exempt
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format=%ae "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line (use git commit -s)"
              bad=1
            fi
          done
          exit $bad
