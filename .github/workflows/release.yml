name: Release

# a tag v* : the tests, then the binary, the image on ghcr.io and the GitHub release, each signed (keyless, with the identity of this workflow) and with a build provenance attestation
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release
      packages: write        # the image
      id-token: write        # the keyless signature and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hsmgate-linux-amd64
          path: build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package
        run: |
          mkdir -p dist
          cp build/hsmgate dist/hsmgate-linux-amd64
          cp build/hsmgate-fips dist/hsmgate-linux-amd64-fips
          chmod 755 dist/hsmgate-linux-amd64 dist/hsmgate-linux-amd64-fips
          sha256sum dist/hsmgate-linux-amd64 > dist/hsmgate-linux-amd64.sha256
          sha256sum dist/hsmgate-linux-amd64-fips > dist/hsmgate-linux-amd64-fips.sha256
          tar -czf dist/hsmgate-deploy.tar.gz LICENSE README.md api deploy docs
          cp vex/hsmgate.openvex.json dist/hsmgate.openvex.json

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/hsmgate.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the files
        run: |
          for f in dist/hsmgate-linux-amd64 dist/hsmgate-linux-amd64-fips dist/hsmgate-deploy.tar.gz dist/hsmgate.spdx.json dist/hsmgate.openvex.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Provenance of the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/hsmgate-linux-amd64
            dist/hsmgate-linux-amd64-fips
            dist/hsmgate-deploy.tar.gz

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Image, FIPS variant
        id: push_fips
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            GOFIPS140=v1.0.0
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-fips

      - name: Sign the images
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          IMAGE_FIPS: ghcr.io/${{ github.repository }}@${{ steps.push_fips.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign sign --yes "$IMAGE_FIPS"

      - name: Provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Provenance of the FIPS image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push_fips.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
