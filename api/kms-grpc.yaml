openapi: 3.1.0
info:
  title: hsmgate gRPC face (KMS-gRPC)
  version: 0.1.0
  summary: 'A subset of the gRPC API of a cloud key service. Optional (kmsgrpc.enabled). Documented as OpenAPI for lack of a better page: it is not REST.'
  description: 'gRPC unary calls over HTTP/2 on the same listener as the other faces, messages in protobuf. There is no `.proto` file and no gRPC library in the service: the framing and the few messages
    are written by hand (`internal/face/kmsgrpc/pb.go`); the field numbers are those of the public definitions of the cloud service the clients are written for, and are checked by the black-box test `test/kmsgrpc-sdk`
    with its official client library. **The face is not that service** and not affiliated with its vendor (docs/specs/kms-grpc.md).


    OpenAPI cannot describe gRPC, so each method is shown as a `POST` with `application/grpc`; the messages are listed with their field numbers (`x-protobuf-fields`). **Try it out cannot work here.** The
    authors of the client libraries use these calls; people usually need only the table of methods and the status codes.


    **Authentication**: a service account JWT (RS256), traded at `POST <kmsgrpc.token_path>` (`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer`) for an opaque access token, or sent as the bearer
    itself. A client certificate, if shown, must be the client''s; without one the client needs `jwt.no_cert` and a listed address. The token endpoint is shown below.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://hsmgate.example.org:8443
  description: Replace with the address of your service.
tags:
- name: auth
  description: Token endpoint
- name: methods
  description: KeyManagementService methods that are served
paths:
  /oauth2/token:
    post:
      operationId: token
      tags:
      - auth
      summary: Trade a JWT assertion (RS256) for an access token (one hour, in memory only)
      description: The path is `kmsgrpc.token_path` (default `/oauth2/token`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - assertion
              properties:
                grant_type:
                  type: string
                  const: urn:ietf:params:oauth:grant-type:jwt-bearer
                assertion:
                  type: string
                  description: A JWT, RS256, issuer = jwt.issuer; not expired (5 minutes of skew), not issued in the future, at most 24 hours long
      responses:
        '200':
          description: An opaque bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
        '400':
          description: A request the endpoint does not take
        '401':
          description: The assertion is not valid
  /google.cloud.kms.v1.KeyManagementService/GetPublicKey:
    post:
      operationId: GetPublicKey
      tags:
      - methods
      summary: Public key of a sign_verify key (PEM, EC_SIGN_P256_SHA256, pem_crc32c)
      description: 'Unary call over HTTP/2: `POST /google.cloud.kms.v1.KeyManagementService/GetPublicKey`, `Content-Type: application/grpc`, a protobuf message in gRPC framing. Resource names are `projects/P/locations/L/keyRings/R/cryptoKeys/KEY[/cryptoKeyVersions/N]`
        with P, L, R from the configuration. Status codes: UNAUTHENTICATED (token), PERMISSION_DENIED (key not there, not on the face, or no right: one answer), INVALID_ARGUMENT, RESOURCE_EXHAUSTED, UNAVAILABLE
        (token locked or absent, audit), INTERNAL.'
      requestBody:
        required: true
        content:
          application/grpc:
            schema:
              $ref: '#/components/schemas/GetPublicKeyRequest'
      responses:
        '200':
          description: OK (grpc-status 0)
          content:
            application/grpc:
              schema:
                $ref: '#/components/schemas/PublicKey'
        default:
          description: A non-zero grpc-status (see the description)
  /google.cloud.kms.v1.KeyManagementService/AsymmetricSign:
