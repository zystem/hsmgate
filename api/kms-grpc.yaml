        with P, L, R from the configuration. Status codes: UNAUTHENTICATED (token), PERMISSION_DENIED (key not there, not on the face, or no right: one answer), INVALID_ARGUMENT, RESOURCE_EXHAUSTED, UNAVAILABLE
        (token locked or absent, audit), INTERNAL.'
      requestBody:
