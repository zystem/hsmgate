      x-protobuf-fields:
        name: 1
    PublicKey:
      type: object
      description: A protobuf message. Fields are listed with their numbers; on the wire the body is protobuf in gRPC framing, not JSON.
      properties:
        pem:
          description: 'field 1: string'
        algorithm:
          description: 'field 2: enum'
        pem_crc32c:
          description: 'field 3: Int64Value'
        name:
          description: 'field 4: string'
        protection_level:
          description: 'field 5: enum'
      x-protobuf-fields:
        pem: 1
        algorithm: 2
        pem_crc32c: 3
        name: 4
        protection_level: 5
    AsymmetricSignRequest:
