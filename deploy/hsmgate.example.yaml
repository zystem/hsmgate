# hsmgate.example.yaml: one SmartCard-HSM, three clients. Copy to /etc/hsmgate/hsmgate.yaml and edit.
listen: 0.0.0.0:8443
tls:
  cert: /etc/hsmgate/server.pem       # the service's own certificate (TLS 1.3 is the only version offered)
  key: /etc/hsmgate/server.key
  client_ca: /etc/hsmgate/clients-ca.pem   # only certificates from this CA get past the handshake
admin_socket: /run/hsmgate/admin.sock # unlock and status; mode 0600, a short path (unix sockets allow ~108 bytes)
audit: {file: /var/log/hsmgate/audit.log}
# metrics: {enabled: false, detail: basic}    # GET /metrics on the admin socket; sensitive (docs/operations.md)
# optional second face (docs/specs/kms-json.md): ECDH for clients that sign requests; enabling it needs a restart
# kmsjson: {enabled: true, region: local, mac_cache_seconds: 0}

tokens:
  - name: card
    type: pkcs11
    module: /usr/lib/x86_64-linux-gnu/opensc-pkcs11.so
    token_label: mytoken               # or token_serial: <serial of the token>
    keys: {m1: 0123456789abcdef0123456789abcdef01234567}   # label -> CKA_ID of the key pair, hex
    # pin_file: /run/credentials/hsmgate.service/pin       # tried ONCE at start; without it: `hsmgate unlock -token card`

keys:
  # CiNim: the shard's master key; the context (the organisation) is part of the sealed text and must begin with one of `allow`
  cinim-shard:
    versions: [{token: card, label: m1}]
    aad: {mode: context, allow: ["cinim/dek/v1|"]}
  # applications' secrets in Kubernetes: the context is k8s/<namespace>/<secret>/<field>
  apps:
    versions: [{token: card, label: m1}]
    aad: {mode: context, allow: ["k8s/"]}
  # OpenBao's seal `transit` sends no context: a fixed one (default "openbao/seal/v1|<key>", the value kekd used)
  bao-seal:
    versions: [{token: card, label: m1}]
    aad: {mode: fixed}
  # the etcd encryption plugin (vault-kubernetes-kms) sends no context either; give it its own constant
  k8s-etcd:
    versions: [{token: card, label: m1}]
    aad: {mode: fixed, fixed: "k8s-kms/v1|k8s-etcd"}

clients:
  - name: cinim-core
    identity: {uri: "spiffe://example.org/ns/cinim/sa/core"}   # URI SAN; or sha256: <hex of the certificate>, or cn: ... as the last resort
    keys:
      cinim-shard: {ops: [encrypt, decrypt, rewrap], per_minute: 120, per_day: 20000}
  - name: openbao
    identity: {cn: openbao}
    keys:
      bao-seal: {ops: [encrypt, decrypt], per_minute: 30}
  # a namespace of the cluster that keeps ciphertexts in its Secrets (docs/guides/kubernetes-pod-secrets.md): decrypt only, and only its own contexts
  - name: ns-shop
    identity: {cn: ns-shop}
    keys:
      apps: {ops: [decrypt], contexts: ["k8s/shop/"], per_minute: 120}
  - name: kube-kms
    identity: {cn: kube-kms}
    keys:
      k8s-etcd: {ops: [encrypt, decrypt], per_minute: 600}
  # the KMS-JSON face (docs/specs/kms-json.md): needs `kmsjson: true` on the key (aad mode fixed) and a signing credential on the client
  # - name: sealer
  #   identity: {cn: sealer}
  #   sigv4: {access_key_id: AKIDEXAMPLEEXAMPLE1, secret_file: /etc/hsmgate/sealer.sigv4}   # mode 0600, at least 20 bytes
  #   keys:
  #     ecdh-key: {ops: [derive], per_minute: 120}     # a key with kmsjson_usage: key_agreement (the default)
  #     app-key: {ops: [encrypt, decrypt]}              # a key with kmsjson_usage: encrypt_decrypt: the service seals
  #     mac-key: {ops: [generate_mac, verify_mac]}      # a key with kmsjson_usage: generate_verify_mac: HMAC-SHA-256 under a key derived on the token (its own key, not shared)
  #     release-key: {ops: [sign, verify]}              # a key with kmsjson_usage: sign_verify: ECDSA on the token (its own key, not shared)
  # a program that cannot show a certificate (docs/specs/kms-json.md, section 5): the signature alone, from listed addresses, a sealing key only, a secret of 32 bytes or more
  # - name: spring-app
  #   sigv4: {access_key_id: AKIDSPRINGSPRINGSPR0, secret_file: /etc/hsmgate/spring.sigv4, no_cert: true, allow_from: [10.20.0.0/16]}
  #   keys:
  #     app-key: {ops: [encrypt, decrypt]}
