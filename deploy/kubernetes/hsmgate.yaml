# An example, NOT run on a cluster: one hsmgate on the node that has the reader. pcscd runs on the host (or as a DaemonSet) and its socket is shared.
# The card is a single resource: one replica, pinned to the node (nodeSelector), Recreate strategy so that two pods never open the card at once.
apiVersion: v1
kind: Secret
metadata: {name: hsmgate-config, namespace: hsmgate}
type: Opaque
stringData:
  hsmgate.yaml: |
    # see deploy/hsmgate.example.yaml; paths below are the mounts of this Pod
    listen: 0.0.0.0:8443
    tls: {cert: /etc/hsmgate/tls/tls.crt, key: /etc/hsmgate/tls/tls.key, client_ca: /etc/hsmgate/tls/ca.crt}
    admin_socket: /run/hsmgate/admin.sock
    tokens:
      - {name: card, type: pkcs11, module: /usr/lib/x86_64-linux-gnu/opensc-pkcs11.so, token_label: cinim, keys: {m1: 0123456789abcdef0123456789abcdef01234567}}
    keys:
      cinim-shard: {versions: [{token: card, label: m1}], aad: {mode: context, allow: ["cinim/dek/v1|"]}}
    clients:
      - {name: cinim-core, identity: {uri: "spiffe://example.org/ns/cinim/sa/core"}, keys: {cinim-shard: {ops: [encrypt, decrypt, rewrap], per_minute: 120}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hsmgate, namespace: hsmgate}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: hsmgate}}
  template:
    metadata: {labels: {app: hsmgate}}
    spec:
      nodeSelector: {hsmgate/reader: "true"}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hsmgate
          image: registry.example.org/hsmgate:latest
          args: ["serve", "-config", "/etc/hsmgate/hsmgate.yaml"]
          ports: [{containerPort: 8443, name: https}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {tcpSocket: {port: https}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/hsmgate/hsmgate.yaml, subPath: hsmgate.yaml, readOnly: true}
            - {name: tls, mountPath: /etc/hsmgate/tls, readOnly: true}
            - {name: pcscd, mountPath: /run/pcscd}
            - {name: run, mountPath: /run/hsmgate}
      volumes:
        - {name: config, secret: {secretName: hsmgate-config}}
        - {name: tls, secret: {secretName: hsmgate-tls}}        # tls.crt, tls.key, ca.crt (the CA of the clients)
        - {name: pcscd, hostPath: {path: /run/pcscd, type: Directory}}
        - {name: run, emptyDir: {medium: Memory}}
---
apiVersion: v1
kind: Service
metadata: {name: hsmgate, namespace: hsmgate}
spec:
  selector: {app: hsmgate}
  ports: [{name: https, port: 8443, targetPort: https}]
---
# only the clients may reach the service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: hsmgate, namespace: hsmgate}
spec:
  podSelector: {matchLabels: {app: hsmgate}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cinim}}}]
      ports: [{port: 8443}]
