# hsmgate in Docker on a machine (or VM) that has the reader. pcscd runs on the host; its socket is mounted. One container per card.
# Put hsmgate.yaml, server.pem, server.key and clients-ca.pem in ./config (see ../hsmgate.example.yaml) with the paths /etc/hsmgate/... in it.
services:
  hsmgate:
    # a package that CI pushes to ghcr.io is PRIVATE until its owner makes it public (GitHub: Packages -> hsmgate -> Package settings -> Change visibility).
    # Until then: `docker login ghcr.io` with a token that has read:packages, or build locally with the `build:` line below instead of `image:`.
    image: ghcr.io/zystem/hsmgate:v0.1.1@sha256:c17e7cfcaae0f9f67b9ef5b5362651b3679743e88d6d9b3136ffc4a8620c965a   # pinned by digest; Renovate bumps it. Or: build: {context: ../.., args: {VERSION: dev}}
    restart: unless-stopped
    # root inside the container, with every capability dropped and a read-only root file system: Debian's pcscd asks polkit, which lets only a local
    # active session (or a user a rule names) use the card, and a container process is in none. Verified on a card. For a non-root user, see docs/operations.md.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    ports: ["8443:8443"]
    volumes:
      - ./config:/etc/hsmgate:ro
      - /run/pcscd:/run/pcscd                     # the host's pcscd socket (the reader stays with the host)
    tmpfs:
      - /run/hsmgate:mode=0700                       # the admin socket
      - /var/log/hsmgate:mode=0750                   # or mount a host directory to keep the audit log
    # --- THE PIN: choose one way ---
    # 1. (recommended) put no PIN anywhere. The service starts with the token locked; after each start type the PIN once, it stays in memory only:
    #      docker compose exec hsmgate hsmgate unlock -config /etc/hsmgate/hsmgate.yaml -token card
    # 2. from a file, so that the service unlocks itself at start (the PIN then rests on this machine). Three steps:
    #      a. make the file owned by ROOT, mode 0400 (the container runs as root without capabilities, so a file of another owner is not readable):
    #           install -d -m 0700 secrets && printf '%s' "$PIN" | sudo install -o root -g root -m 0400 /dev/stdin secrets/pin
    #      b. uncomment `secrets: [hsmgate_pin]` below and the `secrets:` block at the end of this file
    #      c. in hsmgate.yaml give the token  pin_file: /run/secrets/hsmgate_pin
    #    The PIN is tried ONCE at every start. A wrong PIN costs a try of the card (it blocks after 3) at each restart of the container.
    # secrets: [hsmgate_pin]
    # reload the configuration and certificates:
    #   docker compose kill -s HUP hsmgate

# secrets:
#   hsmgate_pin:
#     file: ./secrets/pin
