# hsmgate with a SOFTWARE token: private keys are files (a Secret). For tests, development and pilots, not for keys that must survive the loss of the cluster:
# whoever reads the Secret has the keys. A card cannot be used from this chart (docs/operations.md).

image:
  repository: ghcr.io/zystem/hsmgate
  tag: ""          # default: the appVersion of the chart
  digest: ""       # "sha256:..." pins the image and wins over the tag; get it from the release notes or `docker buildx imagetools inspect`
  pullPolicy: IfNotPresent
imagePullSecrets: []   # a package on ghcr.io is private until its owner makes it public

# One replica: the rate counters and the audit file are those of a single process, and a soft token is one set of key files.
replicaCount: 1

# --- the soft token ---------------------------------------------------------------------------------------------------------------------------------
softToken:
  name: soft
  # a Secret that holds one key per label: the data key is the label, the value is 64 hexadecimal digits (a P-256 private key).
  existingSecret: ""
  # without existingSecret: make a random key for each label at the first install and KEEP it (the Secret carries helm.sh/resource-policy: keep, so that
  # `helm uninstall` does not destroy the keys: what was sealed under them could never be opened again). Back the Secret up before relying on it.
  generate: true
  labels: [m1]

# --- TLS --------------------------------------------------------------------------------------------------------------------------------------------
# The service answers only clients with a certificate of its CA (the identity of a client is the CN of its certificate). Two ways to have the files:
#  1. (the default) the chart makes a CA, the certificate of the service and the certificates of the clients named below, once, and keeps them (see generate).
#  2. a Secret of yours: existingSecret with tls.crt and tls.key (the certificate of the service; the names clients connect to must be in it) and ca.crt (the CA
#     that signed the certificates of the clients). A cert-manager Certificate from a CA issuer has exactly this shape: examples/cert-manager.yaml.
tls:
  existingSecret: ""
  generate:
    enabled: true
    caDays: 3650
    days: 730              # the service and the clients; nothing renews them: see the README ("Renewal")
    clients: [demo]        # the Secret <fullname>-client-<name> (tls.crt, tls.key, ca.crt) for each; the CN is the name (identity: {cn: ...} in clients below)
    extraNames: []         # more names for the certificate of the service (ingress.host is added by itself)

# --- the configuration (hsmgate.yaml) ------------------------------------------------------------------------------------------------------------------
# listen, tls, admin_socket, audit and the soft token are set by the chart. Here: the keys, the clients and anything else of docs/ (kmsjson, kmsgrpc, kmsrest,
# seal_suite, limits, metrics ...). A key names the soft token and one of its labels.
config:
  extra: {}
    # seal_suite: ecies2
    # kmsjson: {enabled: true, region: local}
  keys:
    demo:
      versions: [{token: soft, label: m1}]
      aad: {mode: fixed}
  clients:
    - name: demo
      identity: {cn: demo}
      keys:
        demo: {ops: [encrypt, decrypt], per_minute: 120}

# --- the audit log ------------------------------------------------------------------------------------------------------------------------------------
# By default the audit goes to the output of the container only. With file: true it is also a file (/var/log/hsmgate/audit.log); on an emptyDir that is lost with the pod, a claim keeps it.
# stdout: also write every line to the output of the container (`kubectl logs`, a log collector). Needs an image with `audit.stdout` (after v0.7.3); set false for an older one.
# file: false (the default) writes no file, only to the output of the container (`kubectl logs`, a log collector; the runtime rotates that and nothing can fill a volume).
# file: true also writes /var/log/hsmgate/audit.log (persistence below keeps it); stdout then says whether the lines are also on the output. maxSizeMB > 0 makes the service rotate the file
# (audit.log.1 ... audit.log.<maxFiles>) so that it cannot fill the volume; 0 means it grows without limit.
audit:
  file: false
  stdout: true
  maxSizeMB: 100
  maxFiles: 5
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    existingClaim: ""

service:
  type: ClusterIP
  port: 8443
  annotations: {}

# An Ingress that PASSES THE TLS THROUGH to the pod (hsmgate decides by the certificate the client presents in the handshake, so a controller that ends TLS
# would hide the client). Needs a controller that can pass through: ingress-nginx started with --enable-ssl-passthrough (the chart adds the annotation for
# className "nginx"); for another controller put what it needs in `annotations`, or use a Service of type LoadBalancer instead. The host must be one of the
# names in the certificate of the service (the chart adds it when it makes the certificate). With networkPolicy.enabled, add the namespace of the controller to networkPolicy.from.
ingress:
  enabled: false
  className: nginx
  host: ""               # e.g. hsmgate.example.com (required when enabled)
  annotations: {}

# Only the listed sources may reach the port; an empty list allows every pod of the cluster (the service answers only to a client certificate anyway).
networkPolicy:
  enabled: false
  from: []     # e.g. [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: apps}}}]

resources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {memory: 128Mi}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  create: true
  name: ""
  annotations: {}
