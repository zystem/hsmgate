{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hsmgate.fullname" . }}
  labels: {{- include "hsmgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "hsmgate.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress: []          # the service calls nothing
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
