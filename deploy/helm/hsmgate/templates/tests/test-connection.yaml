apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hsmgate.fullname" . }}-test
  labels: {{- include "hsmgate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: ping
      image: {{ include "hsmgate.image" . | quote }}
      args: [ping, -addr, {{ printf "%s:%v" (include "hsmgate.fullname" .) .Values.service.port | quote }}]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
