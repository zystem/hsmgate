{{- if and .Values.softToken.generate (not .Values.softToken.existingSecret) }}
{{- $name := include "hsmgate.softSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hsmgate.labels" . | nindent 4 }}
  annotations:
    # the keys are the only copy: `helm uninstall` must not destroy them
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range .Values.softToken.labels }}
  {{- if and $old (hasKey $old.data .) }}
  {{ . }}: {{ index $old.data . }}
  {{- else }}
  {{ . }}: {{ sha256sum (randAlphaNum 64) | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
