{{- $soft := dict }}
{{- range .Values.softToken.labels }}{{ $_ := set $soft . (printf "/etc/hsmgate/soft/%s" .) }}{{ end }}
{{- $audit := dict }}
{{- $files := int .Values.audit.maxFiles | default 5 }}
{{- if and .Values.audit.file (not .Values.audit.persistence.enabled) .Values.audit.maxSizeMB (gt (mul (int .Values.audit.maxSizeMB) (add1 $files)) 256) }}
{{ fail (printf "audit.maxSizeMB x (maxFiles + 1) = %d MB does not fit the 256 MiB emptyDir of the audit volume: lower them or set audit.persistence.enabled" (mul (int .Values.audit.maxSizeMB) (add1 $files))) }}
{{- end }}
{{- if .Values.audit.file }}
{{- $_ := set $audit "file" "/var/log/hsmgate/audit.log" }}
{{- $_ := set $audit "stdout" .Values.audit.stdout }}
{{- if .Values.audit.maxSizeMB }}{{ $_ := set $audit "max_size_mb" .Values.audit.maxSizeMB }}{{ $_ := set $audit "max_files" .Values.audit.maxFiles }}{{ end }}
{{- end }}
{{- $base := dict
  "listen" "0.0.0.0:8443"
  "tls" (dict "cert" "/etc/hsmgate/tls/tls.crt" "key" "/etc/hsmgate/tls/tls.key" "client_ca" "/etc/hsmgate/tls/ca.crt")
  "admin_socket" "/run/hsmgate/admin.sock"
  "audit" $audit
  "tokens" (list (dict "name" .Values.softToken.name "type" "soft" "keys" $soft))
  "keys" .Values.config.keys
  "clients" .Values.config.clients }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hsmgate.fullname" . }}
  labels: {{- include "hsmgate.labels" . | nindent 4 }}
data:
  hsmgate.yaml: |
{{ merge (deepCopy $base) (deepCopy .Values.config.extra) | toYaml | indent 4 }}
