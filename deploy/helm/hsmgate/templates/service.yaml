apiVersion: v1
kind: Service
metadata:
  name: {{ include "hsmgate.fullname" . }}
  labels: {{- include "hsmgate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "hsmgate.selector" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
